; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Settings mirror https://github.com/Xinyuan-LilyGO/LilyGo-Modem-Series/blob/main/platformio.ini
[env:T-Call-A7670X-V1-0]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters =
    default
    esp32_exception_decoder
build_flags =
    -mfix-esp32-psram-cache-issue
    -DBOARD_HAS_PSRAM
    -DLILYGO_T_CALL_A7670_V1_0
lib_deps =
    ; LilyGo's TinyGSM fork (adds A7670 support), same code as LilyGo-Modem-Series/lib/TinyGSM
    https://github.com/lewisxhe/TinyGSM-fork.git#b1241d36befa86398200ae9ada55a96b4803f7a3
    vshymanskyy/StreamDebugger@^1.0.1
    mikalhart/TinyGPSPlus@^1.0.3

; Same board, flashed/monitored through the ESP32-C3 SuperMini USB-UART bridge (see ../usb-uart-adapter).
; The bridge is fixed at 115200 and toggling DTR/RTS resets the C3, not the T-Call, so enter
; download mode by hand: hold BOOT, press RST, release BOOT. Press RST after upload.
[env:T-Call-A7670X-V1-0-bridge]
extends = env:T-Call-A7670X-V1-0
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
upload_speed = 115200
board_upload.before_reset = no_reset
board_upload.after_reset = no_reset
monitor_dtr = 0
monitor_rts = 0
