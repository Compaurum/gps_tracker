; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = T-Call-A7670X-V1-0-bridge
; Device identity, endpoint and certificate location. Gitignored; template in README → Setup.
extra_configs = secrets.ini

[firmware]
version = 0.1.0

; Shared by the device and native (unit test) builds; lib/core uses it.
[common]
lib_deps =
    bblanchon/ArduinoJson@7.4.3
; ts is int64 epoch ms; make sure ArduinoJson keeps 64-bit integers on the 32-bit ESP32.
json_flags = -DARDUINOJSON_USE_LONG_LONG=1

; Settings mirror https://github.com/Xinyuan-LilyGO/LilyGo-Modem-Series/blob/main/platformio.ini
[env:T-Call-A7670X-V1-0]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters =
    default
    esp32_exception_decoder
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -mfix-esp32-psram-cache-issue
    -DBOARD_HAS_PSRAM
    -DLILYGO_T_CALL_A7670_V1_0
    ${common.json_flags}
    -DFW_VERSION=\"${firmware.version}\"
    -DDEVICE_ID=\"${secrets.device_id}\"
    -DMQTT_HOST=\"${secrets.mqtt_host}\"
    -DCELL_APN=\"${secrets.apn}\"
    ; Log every AT line exchanged with the modem (certificate and payload bytes are never logged).
    -DAT_TRACE=1
build_src_filter = +<*> -<provision/>
lib_deps = ${common.lib_deps}

; Same board, flashed/monitored through the ESP32-C3 SuperMini USB-UART bridge (see ../usb-uart-adapter).
; The bridge is fixed at 115200 and toggling DTR/RTS resets the C3, not the T-Call, so enter
; download mode by hand: hold BOOT, press RST, release BOOT. Press RST after upload.
[env:T-Call-A7670X-V1-0-bridge]
extends = env:T-Call-A7670X-V1-0
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
upload_speed = 115200
board_upload.before_reset = no_reset
board_upload.after_reset = no_reset
monitor_dtr = 0
monitor_rts = 0
extra_scripts = post:scripts/bridge_no_reset.py

; One-off firmware that writes the AWS certificates into the modem's certificate store, then
; becomes an AT pass-through shell. Its image contains the private key: erase flash after use
; (see README → Provisioning).
[env:T-Call-A7670X-V1-0-bridge-provision]
extends = env:T-Call-A7670X-V1-0-bridge
build_src_filter = +<platform/> +<drivers/> +<provision/>
extra_scripts =
    pre:scripts/embed_certs.py
    post:scripts/bridge_no_reset.py
custom_certs_dir = ${secrets.certs_dir}
custom_device_id = ${secrets.device_id}

; Host-side unit tests for lib/core: pio test -e native
[env:native]
platform = native
test_framework = unity
lib_deps = ${common.lib_deps}
build_flags =
    -std=c++17
    -Wall
    -Wextra
    ${common.json_flags}
    -DUNITY_INCLUDE_DOUBLE
